<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Walkart Affiliate Platform</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-page { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; background: var(--bg-light); padding: 40px 24px; }
    .login-box { width: 100%; max-width: 420px; }
    .login-box .logo { font-size: 26px; font-weight: 800; color: var(--blue); text-decoration: none; display: block; text-align: center; margin-bottom: 8px; }
    .login-box .logo span { color: var(--text); }
    .login-tagline { text-align: center; color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-muted); font-size: 14px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .forgot-link { float: right; font-size: 13px; }
    .tabs { border-bottom: 2px solid var(--border); margin-bottom: 28px; display: flex; }
    .tab-btn { padding: 10px 20px; background: none; border: none; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .15s; }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>

<header class="header">
  <div class="container">
    <div class="header-inner">
      <a href="/" class="logo">Walk<span>art</span></a>
      <div class="header-actions" style="margin-left:auto">
        <a href="/publishers/" class="btn btn-primary">Sign up free</a>
      </div>
    </div>
  </div>
</header>

<div class="login-page">
  <div class="login-box">
    <a href="/" class="logo">Walk<span>art</span></a>
    <p class="login-tagline">Publisher &amp; Merchant Dashboard</p>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="publisher">Publisher</button>
        <button class="tab-btn" data-tab="merchant">Merchant</button>
      </div>

      <div id="tab-publisher" class="tab-panel active">
        <form id="login-form-publisher">
          <div class="form-group">
            <label class="form-label" for="pub-email">Email address</label>
            <input class="form-input" type="email" id="pub-email" placeholder="you@yoursite.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="pub-password">
              Password
              <a href="/forgot-password/" class="forgot-link">Forgot password?</a>
            </label>
            <input class="form-input" type="password" id="pub-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:4px">Log in to Publisher Dashboard</button>
        </form>
        <div class="divider">new to Walkart?</div>
        <a href="/publishers/" class="btn btn-outline btn-full">Create publisher account →</a>
      </div>

      <div id="tab-merchant" class="tab-panel">
        <form id="login-form-merchant">
          <div class="form-group">
            <label class="form-label" for="mer-email">Email address</label>
            <input class="form-input" type="email" id="mer-email" placeholder="you@yourstore.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="mer-password">
              Password
              <a href="/forgot-password/" class="forgot-link">Forgot password?</a>
            </label>
            <input class="form-input" type="password" id="mer-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:4px">Log in to Merchant Dashboard</button>
        </form>
        <div class="divider">not yet a merchant?</div>
        <a href="/merchants/#contact" class="btn btn-outline btn-full">Contact our sales team →</a>
      </div>
    </div>

    <p style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:20px">
      By logging in you agree to our <a href="/terms/">Terms of Service</a> and <a href="/privacy/">Privacy Policy</a>.
    </p>
  </div>
</div>

<script src="/js/main.js"></script>
<script>
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
  ['login-form-publisher','login-form-merchant'].forEach(id => {
    const f = document.getElementById(id);
    if (f) f.addEventListener('submit', e => {
      e.preventDefault();
      const btn = f.querySelector('[type="submit"]');
      btn.disabled = true; btn.textContent = 'Signing in…';
      setTimeout(() => { btn.disabled = false; btn.textContent = btn.textContent.replace('Signing in…', 'Log in to ' + (id.includes('publisher') ? 'Publisher' : 'Merchant') + ' Dashboard'); alert('Dashboard coming soon! Your account is being set up.'); }, 1500);
    });
  });
</script>
<script type="text/javascript" src="https://s.skimresources.com/js/304338X1792508.skimlinks.js"></script>
</body>
</html>
