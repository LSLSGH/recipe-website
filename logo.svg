<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D6D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9184A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="44" ry="44" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="200" height="100" rx="44" ry="44" fill="url(#shine)"/>

  <!-- Fork -->
  <g transform="translate(52, 38)" fill="#ffffff" opacity="0.95">
    <!-- Fork handle -->
    <rect x="17" y="75" width="7" height="55" rx="3.5"/>
    <!-- Fork tines -->
    <rect x="9"  y="20" width="4" height="40" rx="2"/>
    <rect x="17" y="20" width="4" height="40" rx="2"/>
    <rect x="25" y="20" width="4" height="40" rx="2"/>
    <!-- Fork connector -->
    <rect x="9" y="56" width="20" height="8" rx="2"/>
  </g>

  <!-- Knife -->
  <g transform="translate(100, 38)" fill="#ffffff" opacity="0.95">
    <!-- Knife handle -->
    <rect x="20" y="75" width="7" height="55" rx="3.5"/>
    <!-- Knife blade -->
    <path d="M20,20 Q38,20 38,55 L20,62 Z" />
    <!-- Blade edge line -->
    <line x1="20" y1="20" x2="20" y2="62" stroke="#FF4D6D" stroke-width="1.5"/>
  </g>

  <!-- W letter under cutlery -->
  <text x="100" y="172" font-family="'Arial Black', Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3" opacity="0.95">WALKART</text>
</svg>
